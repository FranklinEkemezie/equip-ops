name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++23 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Build and run unit tests
        run: make test CXX=g++-14
      - name: Build release binary
        run: make release CXX=g++-14
